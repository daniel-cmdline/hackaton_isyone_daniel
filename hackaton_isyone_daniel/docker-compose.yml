services:
  # -------------------------------------------------------------
  # SERVIÇO 1: BANCO DE DADOS (POSTGRESQL)
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: hackaton_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    # 🏥 HEALTHCHECK: Testa se o Postgres está aceitando conexões de verdade antes de liberar o app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - isy-network

  # -------------------------------------------------------------
  # SERVIÇO 2: API & FRONTEND (NEXT.JS APP)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isyone_ops_central
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./scripts:/app/scripts
    # 🔐 SINCRO-BLINDAGEM: O app só dá o boot quando a condição do healthcheck do db for "healthy"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - isy-network

networks:
  isy-network:
    driver: bridge